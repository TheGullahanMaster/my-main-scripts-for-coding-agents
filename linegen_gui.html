<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LineGen Studio</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3f0; --surface: #fcfcfb; --surface-2: #f0efec; --border: #dddcd7;
  --text: #0b0b0b; --text-2: #52514e; --muted: #8a8983; --grid: #e7e6e2;
  --accent: #2a78d6; --accent-ink: #ffffff; --danger: #c93c3b; --good: #008300;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --div-neg: #1c5cab; --div-mid: #f0efec; --div-pos: #b7302f;
  --seq: #cde2fb,#9ec5f4,#6da7ec,#3987e5,#256abf,#184f95,#0d366b;
  --other: #b9b8b2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #34342f;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86; --grid: #2c2c29;
    --accent: #3987e5; --accent-ink: #ffffff; --danger: #e66767; --good: #3fae3f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --div-neg: #5598e7; --div-mid: #383835; --div-pos: #e66767;
    --seq: #0d366b,#104281,#1c5cab,#2a78d6,#5598e7,#86b6ef,#cde2fb;
    --other: #5c5b56;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #34342f;
  --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86; --grid: #2c2c29;
  --accent: #3987e5; --accent-ink: #ffffff; --danger: #e66767; --good: #3fae3f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --div-neg: #5598e7; --div-mid: #383835; --div-pos: #e66767;
  --seq: #0d366b,#104281,#1c5cab,#2a78d6,#5598e7,#86b6ef,#cde2fb;
  --other: #5c5b56;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 15px; margin: 0; font-weight: 650; }
header .meta { color: var(--text-2); font-size: 12px; }
header .spacer { flex: 1; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; }
.status-dot.err { background: var(--danger); }
.layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 14px; padding: 14px 16px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 14px; min-width: 0; }
.card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin: 0 0 10px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card h2 .grow { flex: 1; }
.field { margin-bottom: 10px; }
.field label { display: flex; justify-content: space-between; gap: 8px; font-weight: 550; margin-bottom: 3px; }
.field label .hint { color: var(--muted); font-weight: 400; font-size: 11px; }
.field .row { display: flex; gap: 8px; align-items: center; }
.field input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
input[type=number], input[type=text], select { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font: inherit; min-width: 0; }
input[type=number] { width: 92px; }
.field select, .field input[type=text] { width: 100%; }
.field.out-of-range input[type=number] { border-color: var(--s4); }
button { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.outputs .out { padding: 8px 0; border-top: 1px solid var(--grid); }
.outputs .out:first-child { border-top: 0; padding-top: 0; }
.outputs .name { color: var(--text-2); font-size: 12px; }
.outputs .value { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; word-break: break-all; }
.outputs .target { color: var(--text-2); font-size: 12px; }
.probrow { display: grid; grid-template-columns: minmax(0, 90px) 1fr 48px; gap: 6px; align-items: center; font-size: 12px; margin-top: 3px; }
.probrow .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
.probrow .bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.probrow .bar > div { height: 100%; background: var(--s1); border-radius: 4px; }
.probrow .num { text-align: right; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; color: var(--text-2); }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
.controls .ctl { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--text-2); }
.controls .ctl.check { flex-direction: row; align-items: center; gap: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.chart { position: relative; min-width: 0; }
.chart canvas { display: block; width: 100%; }
.chart .title { font-weight: 600; font-size: 12px; margin-bottom: 4px; display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; }
.chart .title .sub { color: var(--muted); font-weight: 400; }
.tooltip { position: fixed; pointer-events: none; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.15); z-index: 50; display: none; max-width: 320px; font-variant-numeric: tabular-nums; }
.tooltip .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--text-2); margin: 4px 0; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.note { color: var(--text-2); font-size: 12px; margin: 0 0 10px; }
.muted { color: var(--muted); }
table.data { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.data th { color: var(--text-2); font-weight: 600; }
.scroll { overflow-x: auto; }
.strip-row { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px; align-items: center; margin-bottom: 6px; }
.strip-row .lab { font-size: 12px; color: var(--text-2); }
.strip-row .lab b { color: var(--text); font-weight: 600; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 1100px) { .two { grid-template-columns: minmax(0, 1fr); } }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12px; font-variant-numeric: tabular-nums; }
.kv div:nth-child(odd) { color: var(--text-2); }
.toast { position: fixed; bottom: 16px; right: 16px; background: var(--danger); color: #fff; padding: 8px 12px; border-radius: 8px; max-width: min(520px, calc(100vw - 32px)); display: none; z-index: 60; white-space: pre-wrap; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
.modes { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.modes button { border: 0; background: none; padding: 4px 14px; border-radius: 6px; color: var(--text-2); }
.modes button.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
[hidden] { display: none !important; }
.train-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; padding: 14px 16px; align-items: start; }
@media (max-width: 1150px) { .train-grid { grid-template-columns: minmax(0, 1fr); } }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px 12px; }
.form-grid .ctl, .controls .ctl { min-width: 0; }
.form-grid select, .form-grid input[type=number], .form-grid input[type=text] { width: 100%; }
.row-flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row-flex input[type=text] { flex: 1; min-width: 160px; }
.browser { border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; max-height: 260px; overflow: auto; }
.browser .item { padding: 4px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.browser .item:hover { background: var(--surface-2); }
.browser .path { padding: 6px 10px; font-size: 12px; color: var(--text-2); border-bottom: 1px solid var(--grid); position: sticky; top: 0; background: var(--surface); word-break: break-all; }
table.cols td, table.cols th { padding: 3px 6px; }
table.cols tr.sel td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
table.cols td.name { cursor: pointer; font-weight: 550; user-select: none; }
table.cols select { max-width: 190px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: flex; align-items: center; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px 4px 2px 8px; font-size: 12px; }
.chip input { width: 64px; border: 0; background: transparent; padding: 2px; }
.chip button { border: 0; background: none; padding: 0 4px; color: var(--muted); }
.warn { color: var(--danger); font-size: 12px; }
.state { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); }
.state.training, .state.preparing { color: var(--accent); border-color: var(--accent); }
.state.error { color: var(--danger); border-color: var(--danger); }
.state.done { color: var(--good); border-color: var(--good); }
details summary { cursor: pointer; color: var(--text-2); font-size: 12px; margin: 6px 0; }
.nethead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 32px; font-size: 12px; }
.netlegend { display: grid; grid-template-columns: repeat(2, auto); gap: 2px 18px; align-content: start; }
.netlegend .lg-title { grid-column: span 2; }
.lg-title { color: var(--text-2); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; font-size: 11px; margin: 2px 0; }
.lg-row { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.lg-row .ln { display: inline-block; width: 34px; }
.lg-row .sw { display: inline-block; width: 12px; height: 8px; border-radius: 2px; }
.layout > aside, .layout > main { min-width: 0; }  /* let wide content (the diagram) scroll instead of widening the page */
.diagram-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.diagram-scroll .chart { width: max-content; min-width: 100%; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }
.modes { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.modes button { border: 0; background: none; padding: 4px 14px; border-radius: 6px; color: var(--text-2); }
.modes button.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
[hidden] { display: none !important; }
.page { padding: 14px 16px; }
.layout { padding: 0; }
.layout > aside, .layout > main { min-width: 0; }
.row-flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px 12px; }
.form-grid select, .form-grid input[type=number], .form-grid input[type=text] { width: 100%; }
.train-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 1100px) { .train-grid { grid-template-columns: minmax(0, 1fr); } }
.browser { border: 1px solid var(--border); border-radius: 8px; max-height: 280px; overflow: auto; }
.browser .item { padding: 4px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.browser .item:hover { background: var(--surface-2); }
.browser .path { padding: 6px 10px; font-size: 12px; color: var(--text-2); border-bottom: 1px solid var(--grid); position: sticky; top: 0; background: var(--surface); word-break: break-all; }
.fb { margin-top: 8px; }
.warn { color: var(--danger); font-size: 12px; }
.warnpill { color: var(--danger); border-color: var(--danger); }
.state { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); }
.state.training, .state.preparing { color: var(--accent); border-color: var(--accent); }
.state.error { color: var(--danger); border-color: var(--danger); }
.state.done, .state.stopped { color: var(--good); border-color: var(--good); }
details summary { cursor: pointer; color: var(--text-2); font-size: 12px; margin: 6px 0; }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin: 8px 0; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width .5s; }
.dslayout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 860px) { .dslayout { grid-template-columns: minmax(0, 1fr); } }
.classrow { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto 18px auto auto; gap: 6px; align-items: center; margin-bottom: 4px; }
.classrow .sw { width: 12px; height: 12px; border-radius: 3px; }
.classrow .classname { width: 100%; }
.classrow button { padding: 2px 7px; }
.key { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; text-align: center; }
.toolbar { gap: 6px; }
.dsgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--thumb, 112px), 1fr)); gap: 6px; }
.dstile { position: relative; border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: var(--surface-2); cursor: pointer; aspect-ratio: 1; user-select: none; }
.dstile img { width: 100%; height: 100%; object-fit: cover; display: block; image-rendering: auto; }
.dstile.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.dstile.sel::after { content: "✓"; position: absolute; top: 4px; right: 6px; color: #fff; background: var(--accent); border-radius: 10px; width: 20px; height: 20px; text-align: center; font-size: 13px; line-height: 20px; }
.dstile.missing { opacity: .45; outline: 2px dashed var(--danger); }
.dslabel { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; padding: 2px 5px; color: #fff; background: rgba(0,0,0,.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dsdup { position: absolute; top: 4px; left: 4px; font-size: 10px; background: var(--danger); color: #fff; padding: 1px 5px; border-radius: 6px; }
.classbars .probrow { grid-template-columns: minmax(0, 120px) 1fr 56px; }
.probrow { display: grid; grid-template-columns: minmax(0, 110px) 1fr 52px; gap: 6px; align-items: center; font-size: 12px; margin-top: 3px; padding: 1px 3px; border-radius: 4px; }
.probrow.sel { background: var(--surface-2); outline: 1px solid var(--border); }
.probrow .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
.probrow .bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.probrow .bar > div { height: 100%; border-radius: 4px; }
.probrow .num { text-align: right; font-variant-numeric: tabular-nums; }
.value { font-size: 22px; font-weight: 650; }
.auggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 2px 10px; }
.samples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.sample { display: flex; flex-direction: column; align-items: center; font-size: 10px; max-width: 120px; }

.pix { image-rendering: pixelated; }
.probe { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
.mapgrid { display: grid; gap: 6px; margin-top: 6px; }
.tile { cursor: pointer; text-align: center; }
.tilecv { width: 100%; aspect-ratio: 1; image-rendering: pixelated; border-radius: 4px; background: var(--surface-2); display: block; }
.tilelab { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.drop { border: 2px dashed var(--border); border-radius: 8px; min-height: 120px; display: flex; align-items: center; justify-content: center; margin-top: 8px; padding: 6px; text-align: center; }

.modal .card { max-width: 100%; }

canvas { max-width: 100%; }
textarea { width: 100%; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; resize: vertical; }

.tokens.small { max-height: 200px; margin-bottom: 10px; }

</head>
<body>
<header>
  <h1>LineGen Studio</h1>
  <nav class="modes" id="modes"><button data-page="train">Train</button><button data-page="sample">Sample &amp; inspect</button></nav>
  <span class="meta" id="deviceInfo"></span>
  <span class="spacer"></span>
  <button id="themeBtn" title="Toggle light / dark">Theme</button>
</header>
<div id="trainPage" class="page" hidden></div>
<div id="samplePage" class="page" hidden></div>
<div class="tooltip" id="tooltip"></div>

"use strict";
// ───────────────────────── utilities ─────────────────────────
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, ...kids) => {

    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;

  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));

};
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  if (typeof v !== "number") return String(v);
  const a = Math.abs(v);
  if (a !== 0 && (a >= 1e5 || a < 1e-3)) return v.toExponential(2);

}

const kv = (...pairs) => el("div", { class: "kv" }, pairs.map(p => el("div", {}, p)));
// Rebuilding a section and then measuring it (charts read their width) forces a reflow while the page is
// briefly shorter. Firefox clamps the scroll position right then, so the view jumps up. Keep the page at
// least as tall as it was until the rebuild is drawn, and restore the scroll position.
// 1-2-5 step near x, so arrow keys / spinners move number fields by a sensible amount
function niceStep(x) {

  const m = Math.pow(10, Math.floor(Math.log10(x))), f = x / m;
  return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * m;

// Run fn now, or after the user leaves the form field they are typing in (rebuilding would destroy it).

const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

async function api(path, body = {}) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem("linegen." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("linegen." + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};
const series = () => ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"].map(css);

// ───────────────────────── color scales ─────────────────────────
const hex2rgb = h => { h = h.replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));
function seqScale() {
  const stops = css("--seq").split(",").map(s => hex2rgb(s.trim()));
  return t => {
    t = Math.min(1, Math.max(0, Number.isFinite(t) ? t : 0)) * (stops.length - 1);
    const i = Math.min(stops.length - 2, Math.floor(t));
    return mix(stops[i], stops[i + 1], t - i);

}
function divScale() {
  const neg = hex2rgb(css("--div-neg")), mid = hex2rgb(css("--div-mid")), pos = hex2rgb(css("--div-pos"));
  return t => { // t in [-1, 1]
    if (!Number.isFinite(t)) t = 0;
    t = Math.max(-1, Math.min(1, t));
    return t < 0 ? mix(mid, neg, -t) : mix(mid, pos, t);
  };
}
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

// ───────────────────────── chart primitives ─────────────────────────
function niceTicks(lo, hi, n = 5) {
  if (!(hi > lo)) { hi = lo + 1; }
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return out;
}
const tip = $("#tooltip");
function showTip(html, ev) {
  if (!html) { tip.style.display = "none"; return; }
  tip.innerHTML = html; tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  tip.style.left = Math.max(4, x) + "px"; tip.style.top = Math.max(4, y) + "px";
}

class Chart {
  constructor(parent, { height = 240, title = "", sub = "" } = {}) {
    this.root = el("div", { class: "chart" });
    if (title) this.root.append(el("div", { class: "title" }, title, sub ? el("span", { class: "sub" }, sub) : null));
    this.legendEl = el("div", { class: "legend" });
    this.canvas = el("canvas", { role: "img", "aria-label": title || "chart" });
    this.root.append(this.canvas, this.legendEl);
    parent.append(this.root);
    this.height = height; this.canvas.style.height = height + "px";
    this.canvas.addEventListener("mousemove", ev => { if (this.hover) { const p = this.pos(ev); showTip(this.hover(p.x, p.y), ev); this.hoverAt = p; this.redrawOverlay?.(p); } });
    this.canvas.addEventListener("mouseleave", () => { showTip(null); this.hoverAt = null; this.redrawOverlay?.(null); });
    this.canvas.addEventListener("click", ev => { if (this.click) { const p = this.pos(ev); this.click(p.x, p.y); } });
  }
  pos(ev) { const r = this.canvas.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
  setup() {
    const dpr = window.devicePixelRatio || 1, w = Math.max(200, this.canvas.clientWidth || this.root.clientWidth || 400), h = this.height;
    this.canvas.width = Math.round(w * dpr); this.canvas.height = Math.round(h * dpr); this.canvas.style.height = h + "px";
    const ctx = this.canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    this.w = w; this.ctx = ctx;

  }
  legend(items) {
    this.legendEl.replaceChildren(...items.map(([name, color]) => el("span", {}, el("span", { class: "sw", style: `background:${color}` }), name)));
  }

  frame({ xlo, xhi, ylo, yhi, xLabel = "", yLabel = "", xCats = null, yCats = null, left = 52, bottom = 34, yDown = false, intTicks = false }) {
    const ctx = this.ctx, W = this.w, H = this.height;
    const box = { l: left, r: W - 12, t: 8, b: H - bottom };
    const sx = v => box.l + (v - xlo) / (xhi - xlo || 1) * (box.r - box.l);
    const sy = v => yDown ? box.t + (v - ylo) / (yhi - ylo || 1) * (box.b - box.t) : box.b - (v - ylo) / (yhi - ylo || 1) * (box.b - box.t);
    ctx.font = "11px system-ui, sans-serif"; ctx.lineWidth = 1;
    ctx.strokeStyle = css("--grid"); ctx.fillStyle = css("--muted");
    ctx.textAlign = "right"; ctx.textBaseline = "middle";

    } else {
      for (const v of ints(niceTicks(xlo, xhi, Math.max(2, Math.floor((box.r - box.l) / 70))))) { const x = sx(v); ctx.beginPath(); ctx.moveTo(x, box.t); ctx.lineTo(x, box.b); ctx.stroke(); ctx.fillText(fmt(v, 3), x, box.b + 6); }
    }
    ctx.strokeStyle = css("--border"); ctx.beginPath(); ctx.moveTo(box.l, box.b + .5); ctx.lineTo(box.r, box.b + .5); ctx.stroke();

function extent(arrs, pad = 0.06) {
  let lo = Infinity, hi = -Infinity;
  for (const a of arrs) for (const v of a) if (v != null && Number.isFinite(v)) { if (v < lo) lo = v; if (v > hi) hi = v; }

  if (hi === lo) { const d = Math.abs(lo) * 0.1 || 1; lo -= d; hi += d; }
  const p = (hi - lo) * pad; return [lo - p, hi + p];
}

// line chart: x numeric, series [{name, y, color}], optional vline, points, click → x
function drawLine(chart, { x, lines, xLabel, yLabel, vline = null, points = null, yRange = null, yCats = null, onClickX = null, alphaLines = false }) {
  const ctx = chart.setup();
  const xl = [Math.min(...x), Math.max(...x)];
  const yr = yRange || extent(lines.map(s => s.y).concat(points ? [points.y] : []));
  const f = chart.frame({ xlo: xl[0], xhi: xl[1], ylo: yr[0], yhi: yr[1], xLabel, yLabel, yCats });
  const draw = hoverP => {
    ctx.clearRect(0, 0, chart.w, chart.height);
    chart.frame({ xlo: xl[0], xhi: xl[1], ylo: yr[0], yhi: yr[1], xLabel, yLabel, yCats });

      ctx.fillStyle = css("--muted"); ctx.globalAlpha = 0.35;

      ctx.strokeStyle = s.color; ctx.lineWidth = s.width || 2; ctx.globalAlpha = s.alpha ?? 1; ctx.lineJoin = "round";

      ctx.stroke(); ctx.globalAlpha = 1;
    }

      ctx.strokeStyle = css("--text"); ctx.setLineDash([4, 3]); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(f.sx(vline), f.box.t); ctx.lineTo(f.sx(vline), f.box.b); ctx.stroke(); ctx.setLineDash([]);
    }

      ctx.strokeStyle = css("--muted"); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(hoverP.x, f.box.t); ctx.lineTo(hoverP.x, f.box.b); ctx.stroke();
      const i = nearestIdx(x, f.ix(hoverP.x));
      for (const s of lines) if (!alphaLines || s.highlight) { const v = s.y[i]; if (v == null) continue; ctx.fillStyle = s.color; ctx.strokeStyle = css("--surface"); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.sx(x[i]), f.sy(v), 4.5, 0, 7); ctx.fill(); ctx.stroke(); }
    }
    ctx.restore();
  };

    if (mx < f.box.l || mx > f.box.r) return null;
    const i = nearestIdx(x, f.ix(mx));
    const shown = lines.filter(s => !alphaLines || s.highlight).slice(0, 10);
    const rows = shown.map(s => `<div><span class="sw" style="background:${s.color}"></span>${esc(s.name)}: <b>${yCats ? esc(yCats[Math.round(s.y[i])] ?? fmt(s.y[i])) : fmt(s.y[i])}</b></div>`).join("");
    return `<div class="muted">${esc(xLabel)} = ${fmt(x[i])}</div>${rows}${onClickX ? '<div class="muted">click to set input</div>' : ""}`;
  };
  chart.click = onClickX ? (mx => { if (mx >= f.box.l && mx <= f.box.r) onClickX(f.ix(mx)); }) : null;

}
function nearestIdx(arr, v) { let best = 0, bd = Infinity; for (let i = 0; i < arr.length; i++) { const d = Math.abs(arr[i] - v); if (d < bd) { bd = d; best = i; } } return best; }

// categorical x: bars for one series, dot groups for several
function drawCats(chart, { cats, lines, xLabel, yLabel, current = null, yCats = null, onClickCat = null }) {
  const ctx = chart.setup();
  const single = lines.length === 1;
  const yr = extent(lines.map(s => s.y).concat(single ? [[0]] : []), 0.08);
  if (single && yr[0] > 0) yr[0] = 0;
  const f = chart.frame({ xlo: -0.5, xhi: cats.length - 0.5, ylo: yr[0], yhi: yr[1], xLabel, yLabel, xCats: cats, yCats });
  const bw = Math.max(2, Math.min(40, (f.box.r - f.box.l) / cats.length - 2));
  cats.forEach((c, i) => {
    const cx = f.sx(i);
    if (single) {
      const v = lines[0].y[i], y0 = f.sy(Math.max(yr[0], 0)), y1 = f.sy(v);
      ctx.fillStyle = lines[0].color; roundBar(ctx, cx - bw / 2, Math.min(y0, y1), bw, Math.abs(y1 - y0), v >= 0);
      if (String(c) === String(current)) { ctx.strokeStyle = css("--text"); ctx.lineWidth = 2; ctx.strokeRect(cx - bw / 2 - 2, Math.min(y0, y1) - 2, bw + 4, Math.abs(y1 - y0) + 4); }
    } else {
      lines.forEach(s => { ctx.fillStyle = s.color; ctx.strokeStyle = css("--surface"); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, f.sy(s.y[i]), 4.5, 0, 7); ctx.fill(); ctx.stroke(); });
      if (String(c) === String(current)) { ctx.strokeStyle = css("--text"); ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(cx, f.box.t); ctx.lineTo(cx, f.box.b); ctx.stroke(); ctx.setLineDash([]); }
    }
  });
  const idxAt = mx => Math.round(f.ix(mx));
  chart.redrawOverlay = null;
  chart.hover = mx => {
    const i = idxAt(mx); if (i < 0 || i >= cats.length) return null;
    return `<div class="muted">${esc(xLabel)} = ${esc(cats[i])}</div>` + lines.slice(0, 10).map(s => `<div><span class="sw" style="background:${s.color}"></span>${esc(s.name)}: <b>${yCats ? esc(yCats[Math.round(s.y[i])] ?? fmt(s.y[i])) : fmt(s.y[i])}</b></div>`).join("") + (onClickCat ? '<div class="muted">click to set input</div>' : "");
  };

function roundBar(ctx, x, y, w, h, up) {

  else { ctx.moveTo(x, y); ctx.lineTo(x, y + h - r); ctx.arcTo(x, y + h, x + r, y + h, r); ctx.lineTo(x + w - r, y + h); ctx.arcTo(x + w, y + h, x + w, y + h - r, r); ctx.lineTo(x + w, y); }
  ctx.closePath(); ctx.fill();
}

// horizontal signed bars (sensitivity, weights of one neuron)
function drawHBars(chart, { labels, values, valueLabel = "", colorPos, colorNeg, notes = null, onClick = null }) {
  chart.height = Math.max(80, labels.length * 22 + 40);
  const ctx = chart.setup();
  ctx.font = "11px system-ui, sans-serif";
  const lw = Math.min(170, Math.max(60, ...labels.map(l => ctx.measureText(String(l)).width + 16)));
  let lo = Math.min(0, ...values.map(v => v ?? 0)), hi = Math.max(0, ...values.map(v => v ?? 0));
  if (lo === hi) hi = 1;
  const pad = (hi - lo) * 0.05; lo -= lo < 0 ? pad : 0; hi += hi > 0 ? pad : 0;
  const box = { l: lw, r: chart.w - 60, t: 6, b: chart.height - 28 };
  const sx = v => box.l + (v - lo) / (hi - lo) * (box.r - box.l);
  ctx.font = "11px system-ui, sans-serif";
  ctx.strokeStyle = css("--grid"); ctx.fillStyle = css("--muted"); ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (const v of niceTicks(lo, hi, Math.max(2, Math.floor((box.r - box.l) / 80)))) { ctx.beginPath(); ctx.moveTo(sx(v), box.t); ctx.lineTo(sx(v), box.b); ctx.stroke(); ctx.fillText(fmt(v, 3), sx(v), box.b + 4); }
  ctx.fillStyle = css("--text-2"); ctx.textBaseline = "bottom"; ctx.fillText(valueLabel, (box.l + box.r) / 2, chart.height - 1);
  const rowH = (box.b - box.t) / labels.length;
  labels.forEach((l, i) => {
    const y = box.t + i * rowH, v = values[i] ?? 0, bh = Math.max(3, Math.min(14, rowH - 4));
    ctx.fillStyle = css("--text-2"); ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.fillText(String(l).slice(0, 24), box.l - 8, y + rowH / 2);
    ctx.fillStyle = v >= 0 ? colorPos : colorNeg;
    const x0 = sx(0), x1 = sx(v);
    ctx.fillRect(Math.min(x0, x1), y + (rowH - bh) / 2, Math.max(1, Math.abs(x1 - x0)), bh);
    ctx.fillStyle = css("--text"); ctx.textAlign = "left"; ctx.fillText(fmt(v, 3), Math.max(x0, x1) + 4 > box.r ? box.r + 4 : Math.max(x0, x1) + 4, y + rowH / 2);
  });
  ctx.strokeStyle = css("--border"); ctx.beginPath(); ctx.moveTo(sx(0) + .5, box.t); ctx.lineTo(sx(0) + .5, box.b); ctx.stroke();
  chart.redrawOverlay = null;
  const rowAt = my => Math.floor((my - box.t) / rowH);
  chart.hover = (mx, my) => { const i = rowAt(my); if (i < 0 || i >= labels.length) return null; return `<b>${esc(labels[i])}</b>: ${fmt(values[i])}${notes && notes[i] ? `<div class="muted">${notes[i]}</div>` : ""}`; };
  chart.click = onClick ? ((mx, my) => { const i = rowAt(my); if (i >= 0 && i < labels.length) onClick(i); }) : null;
}

// heatmap: z Float32Array row-major [ny][nx]; colorFn(v) → [r,g,b]
// yDown: data row 0 is drawn at the top (matrices); otherwise at the bottom (maps)
function drawHeat(chart, { z, nx, ny, xVals, yVals, xLabel, yLabel, colorFn, valueText, xCats = null, yCats = null, marker = null, points = null, onClick = null, left = 52, bottom = 34, square = false, yDown = false, intTicks = false }) {
  if (square) chart.height = Math.min(420, Math.max(160, Math.round((chart.canvas.clientWidth || 400) * ny / Math.max(nx, 1)) + bottom + 10));
  const ctx = chart.setup();
  // axis limits sit half a cell outside the first/last sample so ticks land on cell centres
  const half = (vals, n) => n > 1 ? (vals[n - 1] - vals[0]) / (n - 1) / 2 : 0.5;
  const hx = xCats ? 0.5 : half(xVals, nx), hy = yCats ? 0.5 : half(yVals, ny);
  const xlo = xCats ? -0.5 : xVals[0] - hx, xhi = xCats ? nx - 0.5 : xVals[nx - 1] + hx;
  const ylo = yCats ? -0.5 : yVals[0] - hy, yhi = yCats ? ny - 0.5 : yVals[ny - 1] + hy;
  const f = chart.frame({ xlo, xhi, ylo, yhi, xLabel, yLabel, xCats, yCats, left, bottom, yDown, intTicks });
  const img = document.createElement("canvas"); img.width = nx; img.height = ny;
  const ictx = img.getContext("2d"), data = ictx.createImageData(nx, ny);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const c = colorFn(z[j * nx + i]), o = ((yDown ? j : ny - 1 - j) * nx + i) * 4;

    if (d.head_entropy?.length > 1) root.insertBefore(el("p", { class: "note" }, "Head focus (mean entropy, lower = sharper): " + d.head_entropy.map((h, i) => `h${i} ${h.toFixed(2)}`).join(" · ")), hm);
    const ch = new Chart(hm, { height: 360, title: `${M.layer} · ${M.kind}`, sub: S.head < 0 ? "mean over heads" : `head ${S.head}` });
    const qlab = i => alignedQ ? JSON.stringify(A.pieces[i + qOff]) : `q${i}`, klab = j => alignedK ? JSON.stringify(A.pieces[j + kOff]) : `k${j}`;
    requestAnimationFrame(() => { drawHeat(ch, { z, nx: d.tk, ny: d.tq, xVals: [...Array(d.tk).keys()], yVals: [...Array(d.tq).keys()], xLabel: "key position (attended to)", yLabel: "query", colorFn: v => sq(Math.pow(v / Math.max(mx, 1e-12), 0.5)), yDown: true, square: true,
      marker: S.attRow ? [selQ, selQ] : null,
      valueText: (j, i, v) => `<div>${esc(qlab(i))} (${i}) → ${esc(klab(j))} (${j})</div><div><b>${(100 * v).toFixed(2)}%</b> of its attention</div>`,
      onClick: (j, i) => { if (alignedQ) { S.sel = i + qOff; renderAnalysis(); } } });
      colorbar(hm, { lo: 0, hi: mx, colorFn: t => sq(Math.pow(t, 0.5)), label: "attention weight (square-root colour scale)" }); });
  } catch (e) { hm.append(el("p", { class: "warn" }, e.message)); }
}
async function tabState(root) {
  const A = S.A, st = A.states, n = A.ids.length;
  const leaf = st.leaves.find(l => l.name === S.leaf) || st.leaves[0]; S.leaf = leaf.name;
  S.stateDelta = leaf.first === 0 && leaf.delta.length === n ? leaf.delta : null;
  drawStrip();
  root.append(el("p", { class: "note" }, "The model was stepped one token at a time and every tensor in its carried state was recorded after each token. “Change” shows how much the state moved when that token was read — tokens that rewrite the memory light up in the text above."));
  if (st.consistency_tv != null) root.append(el("p", { class: st.consistency_tv > 0.05 ? "warn" : "note" }, `Step-by-step vs. whole-sequence prediction at the last token differ by ${(100 * st.consistency_tv).toFixed(2)}% (total variation)` + (st.consistency_tv > 0.05 ? " — the recurrent path and the parallel path disagree for this model." : " — both paths agree.")));
  if (st.dropped?.length) root.append(el("p", { class: "note" }, `Growing caches not shown: ${st.dropped.slice(0, 6).join(", ")}${st.dropped.length > 6 ? "…" : ""}`));
  root.append(el("div", { class: "controls" },
    fld("State tensor", el("select", { onchange: e => { S.leaf = e.target.value; renderAnalysis(); } }, st.leaves.map(l => el("option", { value: l.name, selected: l === leaf }, `${l.name} [${l.shape.join("×")}]${l.subsampled ? ` (${l.units} sampled units)` : ""}`)))),
    fld("Units", el("select", { onchange: e => { S.order = e.target.value; renderAnalysis(); } }, [["variance", "most variable"], ["mean", "largest mean"], ["index", "first by index"]].map(([v, t]) => el("option", { value: v, selected: S.order === v }, t)))),
    fld("How many", numIn(S, "units", { min: 8, max: 512, step: 16 }, () => renderAnalysis(), () => { }))));
  const pal = series(), x = leaf.rms.map((_, i) => i + leaf.first);
  const lc = new Chart(root, { height: 170, title: "State size and change per token", sub: "RMS of the state, and RMS of its change from the previous token" });
  requestAnimationFrame(() => drawXY(lc, { series: [{ name: "state RMS", x, y: leaf.rms, color: pal[6] }, { name: "change", x, y: leaf.delta, color: pal[1] }], xLabel: "position", yLabel: "RMS" }));
  const pick = el("div"), hm = el("div"); root.append(pick, hm);
  try {
    const d = await api("/api/analyze/state", { leaf: leaf.name, units: S.units, order: S.order });
    if (S.A !== A) return;
    unitPicker(pick, { dim: leaf.units, ranked: d.units, aligned: true, noneLabel: "state change per token", what: leaf.subsampled ? "sampled-unit" : "unit" });
    const z = b64f32(d.z), nu = d.units.length, m = Math.max(d.absmax, 1e-12), dv = divScale();
    const zt = new Float32Array(nu * d.rows);
    for (let r = 0; r < d.rows; r++) for (let u = 0; u < nu; u++) zt[u * d.rows + r] = z[r * nu + u];
    const ch = new Chart(hm, { height: Math.min(460, Math.max(220, 16 + nu * 3)), title: leaf.name, sub: `${d.rows} steps × ${nu} units` });
    requestAnimationFrame(() => { drawHeat(ch, { z: zt, nx: d.rows, ny: nu, xVals: [...Array(d.rows).keys()], yVals: [...Array(nu).keys()], yCats: nu <= 40 ? d.units.map(u => "u" + u) : null, xLabel: "after reading position", yLabel: nu <= 40 ? "" : "units (ranked)", colorFn: v => dv(v / m), yDown: true, left: 58, intTicks: true,
      valueText: (i, j, v) => `<b>unit ${d.units[j]}</b> after ${esc(JSON.stringify(A.pieces[i + leaf.first]))} (${i + leaf.first})<div>value ${fmt(v)}</div>`,
      onClick: (i, j) => { S.sel = i + leaf.first; setHighlight(d.units[j]); } });
      colorbar(hm, { lo: -m, hi: m, colorFn: dv, label: "state value", diverging: true }); });
  } catch (e) { hm.append(el("p", { class: "warn" }, e.message)); }
}
function inflScores() { const I = S.infl; if (!I || I.error) return null; return S.inflMethod === "gradient" && I.grad_x_input ? I.grad_x_input : I.ablation; }
async function runInfluence(target = null) {
  const A = S.A;
  try { S.infl = await api("/api/influence", { ids: A.ids, position: S.sel, target }); }
  catch (e) { S.infl = { error: e.message, position: S.sel }; }
  renderAnalysis();
}
function tabInfl(root) {
  const A = S.A, I = S.infl;
  root.append(el("p", { class: "note" }, "Which earlier tokens made the model expect its next token? Red tokens raised the probability of the target, blue ones lowered it. Click a token to choose the position."));
  if (!I || I.position !== S.sel) { root.append(el("div", { class: "muted" }, "computing…")); runInfluence(); return; }
  if (I.error) { root.append(el("p", { class: "warn" }, I.error)); return; }
  const tops = A.positions[S.sel].top;
  root.append(el("div", { class: "controls" },
    fld("Target token", el("select", { onchange: e => runInfluence(e.target.value === "" ? null : +e.target.value) },
      el("option", { value: "" }, S.sel + 1 < A.ids.length ? `actual next ${JSON.stringify(A.pieces[S.sel + 1])}` : "top prediction"),
      tops.map(([t, p, id]) => el("option", { value: id, selected: id === I.target && !(S.sel + 1 < A.ids.length && A.ids[S.sel + 1] === id) }, `${JSON.stringify(t)} (${(100 * p).toFixed(1)}%)`)))),
    fld("Method", el("select", { onchange: e => { S.inflMethod = e.target.value; store.set("inflMethod", S.inflMethod); renderAnalysis(); } },
      [["ablation", "blank out each token (ablation)"], ["gradient", "gradient × input"]].map(([v, t]) => el("option", { value: v, selected: (S.inflMethod || "ablation") === v, disabled: v === "gradient" && !I.grad_x_input }, t))))));
  root.append(el("p", { class: "note" }, `After ${JSON.stringify(A.pieces[S.sel])} (position ${S.sel}) the model gives ${JSON.stringify(I.target_piece)} ${(100 * Math.exp(I.logp)).toFixed(2)}%. ` +
    (S.inflMethod === "gradient" ? "Gradient × input: first-order estimate of each token's effect on log p." : "Ablation: how much log p drops when that token's embedding is replaced by the average embedding (positive = the token helped).")));
  if (S.inflMethod === "gradient" && I.grad_degenerate) root.append(el("p", { class: "warn" }, "Gradient × input is ≈ 0 for this model: a normalisation right after the embedding cancels it. Use ablation."));
  if (I.grad_error && S.inflMethod === "gradient") root.append(el("p", { class: "warn" }, "Gradient unavailable: " + I.grad_error));
  const sc = inflScores();
  const order = sc.map((v, i) => [v, i]).filter(([, i]) => i <= I.position).sort((a, b) => Math.abs(b[0]) - Math.abs(a[0])).slice(0, 15);
  const hb = new Chart(root, { title: "Strongest contributors" });
  requestAnimationFrame(() => drawHBars(hb, { labels: order.map(([, i]) => `${JSON.stringify(A.pieces[i])} @${i}`), values: order.map(([v]) => v),
    valueLabel: S.inflMethod === "gradient" ? "gradient × input" : "drop in log p when blanked (nats)", colorPos: css("--div-pos"), colorNeg: css("--div-neg"), onClick: k => { S.sel = order[k][1]; runInfluence(); } }));
}

// ───────────────────────── shell ─────────────────────────
function showPage(page) {
  G.page = page; store.set("page", page);
  for (const b of $("#modes").children) b.classList.toggle("active", b.dataset.page === page);
  for (const p of ["train", "sample"]) $("#" + p + "Page").hidden = p !== page;
  history.replaceState(null, "", "#" + page);
  if (page === "train") renderTrain(); else renderSample();
}
async function boot() {
  const theme = store.get("theme", null); if (theme) document.documentElement.dataset.theme = theme;
  $("#themeBtn").onclick = () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "light" : "dark"; store.set("theme", document.documentElement.dataset.theme); showPage(G.page);
  };
  for (const b of $("#modes").children) b.onclick = () => showPage(b.dataset.page);
  try { G.opts = await api("/api/options"); } catch (e) { toast("Server unreachable: " + e.message); return; }
  $("#deviceInfo").textContent = `${G.opts.gpu || G.opts.device} · ${G.opts.cwd}`;
  const want = location.hash.slice(1);
  showPage(["train", "sample"].includes(want) ? want : store.get("page", "train"));
  pollTrain();
  let rw, lastW = innerWidth;
  addEventListener("resize", () => { clearTimeout(rw); rw = setTimeout(() => { if (innerWidth !== lastW) whenNotTyping(() => { lastW = innerWidth; showPage(G.page); }); }, 150); });
}
boot();
</script>
