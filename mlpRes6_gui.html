<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLP Studio</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3f0; --surface: #fcfcfb; --surface-2: #f0efec; --border: #dddcd7;
  --text: #0b0b0b; --text-2: #52514e; --muted: #8a8983; --grid: #e7e6e2;
  --accent: #2a78d6; --accent-ink: #ffffff; --danger: #c93c3b; --good: #008300;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --div-neg: #1c5cab; --div-mid: #f0efec; --div-pos: #b7302f;
  --seq: #cde2fb,#9ec5f4,#6da7ec,#3987e5,#256abf,#184f95,#0d366b;
  --other: #b9b8b2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #34342f;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86; --grid: #2c2c29;
    --accent: #3987e5; --accent-ink: #ffffff; --danger: #e66767; --good: #3fae3f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --div-neg: #5598e7; --div-mid: #383835; --div-pos: #e66767;
    --seq: #0d366b,#104281,#1c5cab,#2a78d6,#5598e7,#86b6ef,#cde2fb;
    --other: #5c5b56;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #34342f;
  --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86; --grid: #2c2c29;
  --accent: #3987e5; --accent-ink: #ffffff; --danger: #e66767; --good: #3fae3f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --div-neg: #5598e7; --div-mid: #383835; --div-pos: #e66767;
  --seq: #0d366b,#104281,#1c5cab,#2a78d6,#5598e7,#86b6ef,#cde2fb;
  --other: #5c5b56;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 15px; margin: 0; font-weight: 650; }
header .meta { color: var(--text-2); font-size: 12px; }
header .spacer { flex: 1; }
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; }
.status-dot.err { background: var(--danger); }
.layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 14px; padding: 14px 16px; align-items: start; }
@media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 14px; min-width: 0; }
.card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin: 0 0 10px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.card h2 .grow { flex: 1; }
.field { margin-bottom: 10px; }
.field label { display: flex; justify-content: space-between; gap: 8px; font-weight: 550; margin-bottom: 3px; }
.field label .hint { color: var(--muted); font-weight: 400; font-size: 11px; }
.field .row { display: flex; gap: 8px; align-items: center; }
.field input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
input[type=number], input[type=text], select { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font: inherit; min-width: 0; }
input[type=number] { width: 92px; }
.field select, .field input[type=text] { width: 100%; }
.field.out-of-range input[type=number] { border-color: var(--s4); }
button { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btns { display: flex; gap: 6px; flex-wrap: wrap; }
.outputs .out { padding: 8px 0; border-top: 1px solid var(--grid); }
.outputs .out:first-child { border-top: 0; padding-top: 0; }
.outputs .name { color: var(--text-2); font-size: 12px; }
.outputs .value { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; word-break: break-all; }
.outputs .target { color: var(--text-2); font-size: 12px; }
.probrow { display: grid; grid-template-columns: minmax(0, 90px) 1fr 48px; gap: 6px; align-items: center; font-size: 12px; margin-top: 3px; }
.probrow .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); }
.probrow .bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.probrow .bar > div { height: 100%; background: var(--s1); border-radius: 4px; }
.probrow .num { text-align: right; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; color: var(--text-2); }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
.controls .ctl { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--text-2); }
.controls .ctl.check { flex-direction: row; align-items: center; gap: 6px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.chart { position: relative; min-width: 0; }
.chart canvas { display: block; width: 100%; }
.chart .title { font-weight: 600; font-size: 12px; margin-bottom: 4px; display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; }
.chart .title .sub { color: var(--muted); font-weight: 400; }
.tooltip { position: fixed; pointer-events: none; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.15); z-index: 50; display: none; max-width: 320px; font-variant-numeric: tabular-nums; }
.tooltip .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--text-2); margin: 4px 0; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.note { color: var(--text-2); font-size: 12px; margin: 0 0 10px; }
.muted { color: var(--muted); }
table.data { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.data th { color: var(--text-2); font-weight: 600; }
.scroll { overflow-x: auto; }
.strip-row { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px; align-items: center; margin-bottom: 6px; }
.strip-row .lab { font-size: 12px; color: var(--text-2); }
.strip-row .lab b { color: var(--text); font-weight: 600; }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 1100px) { .two { grid-template-columns: minmax(0, 1fr); } }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12px; font-variant-numeric: tabular-nums; }
.kv div:nth-child(odd) { color: var(--text-2); }
.toast { position: fixed; bottom: 16px; right: 16px; background: var(--danger); color: #fff; padding: 8px 12px; border-radius: 8px; max-width: min(520px, calc(100vw - 32px)); display: none; z-index: 60; white-space: pre-wrap; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
.modes { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
.modes button { border: 0; background: none; padding: 4px 14px; border-radius: 6px; color: var(--text-2); }
.modes button.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
[hidden] { display: none !important; }
.train-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; padding: 14px 16px; align-items: start; }
@media (max-width: 1150px) { .train-grid { grid-template-columns: minmax(0, 1fr); } }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px 12px; }
.form-grid .ctl, .controls .ctl { min-width: 0; }
.form-grid select, .form-grid input[type=number], .form-grid input[type=text] { width: 100%; }
.row-flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row-flex input[type=text] { flex: 1; min-width: 160px; }
.browser { border: 1px solid var(--border); border-radius: 8px; margin-top: 8px; max-height: 260px; overflow: auto; }
.browser .item { padding: 4px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.browser .item:hover { background: var(--surface-2); }
.browser .path { padding: 6px 10px; font-size: 12px; color: var(--text-2); border-bottom: 1px solid var(--grid); position: sticky; top: 0; background: var(--surface); word-break: break-all; }
table.cols td, table.cols th { padding: 3px 6px; }
table.cols tr.sel td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
table.cols td.name { cursor: pointer; font-weight: 550; user-select: none; }
table.cols select { max-width: 190px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: flex; align-items: center; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px 4px 2px 8px; font-size: 12px; }
.chip input { width: 64px; border: 0; background: transparent; padding: 2px; }
.chip button { border: 0; background: none; padding: 0 4px; color: var(--muted); }
.warn { color: var(--danger); font-size: 12px; }
.state { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); }
.state.training, .state.preparing { color: var(--accent); border-color: var(--accent); }
.state.error { color: var(--danger); border-color: var(--danger); }
.state.done { color: var(--good); border-color: var(--good); }
details summary { cursor: pointer; color: var(--text-2); font-size: 12px; margin: 6px 0; }
.nethead { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 32px; font-size: 12px; }
.netlegend { display: grid; grid-template-columns: repeat(2, auto); gap: 2px 18px; align-content: start; }
.netlegend .lg-title { grid-column: span 2; }
.lg-title { color: var(--text-2); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; font-size: 11px; margin: 2px 0; }
.lg-row { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.lg-row .ln { display: inline-block; width: 34px; }
.lg-row .sw { display: inline-block; width: 12px; height: 8px; border-radius: 2px; }
.layout > aside, .layout > main { min-width: 0; }  /* let wide content (the diagram) scroll instead of widening the page */
.diagram-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.diagram-scroll .chart { width: max-content; min-width: 100%; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }
</style>
</head>
<body>
<header>
  <h1>MLP Studio</h1>
  <nav class="modes" id="modes"><button data-page="train">Train</button><button data-page="explore">Explore</button><button data-page="bench">Benchmark</button></nav>
  <span class="meta" id="modelMeta">loading…</span>
  <span class="spacer"></span>
  <span class="meta" id="statusText"><span class="status-dot"></span>connecting</span>
  <label class="meta"><input type="checkbox" id="watch" checked> watch model.pt</label>
  <button id="reloadBtn" title="Reload model.pt from disk now">Reload</button>
  <button id="themeBtn" title="Toggle light / dark">Theme</button>
</header>

<div id="trainPage" class="page" hidden></div>
<div id="benchPage" class="page" hidden></div>
<div id="noModel" class="page" hidden><div class="card empty" style="margin:14px 16px">No trained model yet (no model.pt / config.json in the working directory). Train one on the <b>Train</b> page; the explorer opens it automatically once the first checkpoint is saved.<div id="noModelErr" class="muted" style="margin-top:8px"></div></div></div>
<div class="layout page" id="explorePage" hidden>
  <aside>
    <div class="card">
      <h2><span class="grow">Inputs</span></h2>
      <div id="inputs"></div>
      <div class="btns">
        <button id="randRow" title="Load a random row of the training CSV">Random data row</button>
        <button id="resetBtn">Reset</button>
        <button id="pinBtn" class="primary" title="Save this input/output pair to History">Pin</button>
      </div>
      <p class="note" id="rowNote" style="margin:8px 0 0"></p>
    </div>
    <div class="card">
      <h2><span class="grow">Prediction</span><span class="pill" id="latency"></span></h2>
      <div class="outputs" id="outputs"></div>
    </div>
  </aside>

  <main>
    <div class="tabs" id="tabs"></div>
    <section id="view"></section>
  </main>
</div>
<div class="tooltip" id="tooltip"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
// ───────────────────────── utilities ─────────────────────────
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fmt(v, digits = 4) {
  if (v == null || Number.isNaN(v)) return "–";
  if (typeof v !== "number") return String(v);
  const a = Math.abs(v);
  if (a !== 0 && (a >= 1e5 || a < 1e-3)) return v.toExponential(2);
  return Number(v.toPrecision(digits)).toString();
}
function b64f32(s) {
  const bin = atob(s), buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return new Float32Array(buf.buffer);
}
const kv = (...pairs) => el("div", { class: "kv" }, pairs.map(p => el("div", {}, p)));
// Rebuilding a section and then measuring it (charts read their width) forces a reflow while the page is
// briefly shorter. Firefox clamps the scroll position right then, so the view jumps up. Keep the page at
// least as tall as it was until the rebuild is drawn, and restore the scroll position.
// 1-2-5 step near x, so arrow keys / spinners move number fields by a sensible amount
function niceStep(x) {
  if (!(x > 0) || !Number.isFinite(x)) return 1;
  const m = Math.pow(10, Math.floor(Math.log10(x))), f = x / m;
  return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * m;
}
function keepScroll(fn) {
  const y = window.scrollY, body = document.body;
  // controls carry data-fkey; a rebuild replaces them, so give focus back to the new twin
  const act = document.activeElement, fkey = act && act.dataset ? act.dataset.fkey : null;
  body.style.minHeight = document.documentElement.scrollHeight + "px";
  try { return fn(); } finally {
    if (fkey && !act.isConnected) {
      const twin = document.querySelector(`[data-fkey="${CSS.escape(fkey)}"]`);
      if (twin) twin.focus({ preventScroll: true });
    }
    if (window.scrollY !== y) window.scrollTo(0, y);
    requestAnimationFrame(() => { body.style.minHeight = ""; });
  }
}
// Run fn now, or after the user leaves the form field they are typing in (rebuilding would destroy it).
function whenNotTyping(fn) {
  const a = document.activeElement;
  if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.isConnected) a.addEventListener("blur", () => setTimeout(fn, 0), { once: true });
  else fn();
}
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 6000); }
async function api(path, body = {}) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
const store = {
  get(k, d) { try { const v = localStorage.getItem("mlpres6." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("mlpres6." + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};
const series = () => ["--s1", "--s2", "--s3", "--s4", "--s5", "--s6", "--s7", "--s8"].map(css);

// ───────────────────────── color scales ─────────────────────────
const hex2rgb = h => { h = h.replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const mix = (a, b, t) => a.map((x, i) => Math.round(x + (b[i] - x) * t));
function seqScale() {
  const stops = css("--seq").split(",").map(s => hex2rgb(s.trim()));
  return t => {
    t = Math.min(1, Math.max(0, Number.isFinite(t) ? t : 0)) * (stops.length - 1);
    const i = Math.min(stops.length - 2, Math.floor(t));
    return mix(stops[i], stops[i + 1], t - i);
  };
}
function divScale() {
  const neg = hex2rgb(css("--div-neg")), mid = hex2rgb(css("--div-mid")), pos = hex2rgb(css("--div-pos"));
  return t => { // t in [-1, 1]
    if (!Number.isFinite(t)) t = 0;
    t = Math.max(-1, Math.min(1, t));
    return t < 0 ? mix(mid, neg, -t) : mix(mid, pos, t);
  };
}
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

// ───────────────────────── chart primitives ─────────────────────────
function niceTicks(lo, hi, n = 5) {
  if (!(hi > lo)) { hi = lo + 1; }
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return out;
}
const tip = $("#tooltip");
function showTip(html, ev) {
  if (!html) { tip.style.display = "none"; return; }
  tip.innerHTML = html; tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  tip.style.left = Math.max(4, x) + "px"; tip.style.top = Math.max(4, y) + "px";
}

class Chart {
  constructor(parent, { height = 240, title = "", sub = "" } = {}) {
    this.root = el("div", { class: "chart" });
    if (title) this.root.append(el("div", { class: "title" }, title, sub ? el("span", { class: "sub" }, sub) : null));
    this.legendEl = el("div", { class: "legend" });
    this.canvas = el("canvas", { role: "img", "aria-label": title || "chart" });
    this.root.append(this.canvas, this.legendEl);
    parent.append(this.root);
    this.height = height; this.canvas.style.height = height + "px";
    this.canvas.addEventListener("mousemove", ev => { if (this.hover) { const p = this.pos(ev); showTip(this.hover(p.x, p.y), ev); this.hoverAt = p; this.redrawOverlay?.(p); } });
    this.canvas.addEventListener("mouseleave", () => { showTip(null); this.hoverAt = null; this.redrawOverlay?.(null); });
    this.canvas.addEventListener("click", ev => { if (this.click) { const p = this.pos(ev); this.click(p.x, p.y); } });
  }
  pos(ev) { const r = this.canvas.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
  setup() {
    const dpr = window.devicePixelRatio || 1, w = Math.max(200, this.canvas.clientWidth || this.root.clientWidth || 400), h = this.height;
    this.canvas.width = Math.round(w * dpr); this.canvas.height = Math.round(h * dpr); this.canvas.style.height = h + "px";
    const ctx = this.canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    this.w = w; this.ctx = ctx;
    return ctx;
  }
  legend(items) {

    drawScatter(c1, { pts: ok.map(r => ({ x: r.params, y: r.metric, label: r.name, color: color(r), r })), xLabel: "parameters", yLabel: "score", logX: true, onPick: p => mbPick(p.r) });
    drawScatter(c2, { pts: ok.map(r => ({ x: r.seconds, y: r.metric, label: r.name, color: color(r), r })), xLabel: "seconds", yLabel: "score", onPick: p => mbPick(p.r) });
    drawHBars(c3, { labels: top.map(r => r.name.slice(0, 30)), values: top.map(r => r.metric), valueLabel: MB.st?.settings?.metric || "score", colorPos: css("--s1"), colorNeg: css("--s1"), onClick: i => mbPick(top[i]) });
  });
  if (acts.length <= 12) root.prepend(el("div", { class: "legend" }, acts.map((a, i) => el("span", {}, el("span", { class: "sw", style: `background:${series()[i % 8]}` }), a))));
}
function mbCurves(root, rows) {
  const val = MB.curves === "val", ok = rows.filter(r => (val ? r.val_curve : r.curve)?.length > 1).sort((a, b) => (a.ok ? a.metric : 1e99) - (b.ok ? b.metric : 1e99));
  root.append(el("div", { class: "controls" }, el("select", { onchange: e => { MB.curves = e.target.value; drawBenchMonitor(true); } },
    [["train", "training loss"], ["val", "validation loss"]].map(([v, t]) => el("option", { value: v, selected: v === MB.curves }, t)))));
  if (!ok.length) { root.append(el("p", { class: "muted" }, "No curves of this kind.")); return; }
  const top = new Set(ok.slice(0, 6).map(r => r.name)), ch = new Chart(root, { height: 320, title: val ? "Validation loss" : "Training loss", sub: "log scale · the six best are bold" });
  requestAnimationFrame(() => drawXY(ch, { series: ok.map((r, i) => { const c = val ? r.val_curve : r.curve; return { name: r.name, x: c.map(p => p[0]), y: c.map(p => p[1]), color: series()[i % 8], width: top.has(r.name) ? 2.2 : 1, alpha: top.has(r.name) ? 1 : 0.3, noLegend: !top.has(r.name), noHover: !top.has(r.name) && ok.length > 12, dots: val && top.has(r.name) }; }), xLabel: "step", yLabel: "loss", logY: true }));
}
function mbDetail(root, rows) {
  const r = rows.find(x => x.name === MB.sel) || rows.filter(x => x.ok).sort((a, b) => a.metric - b.metric)[0] || rows[0];
  root.append(el("div", { class: "controls" }, el("select", { onchange: e => { MB.sel = e.target.value; drawBenchMonitor(true); } }, rows.map(x => el("option", { value: x.name, selected: x.name === r.name }, (x.rank ? `#${x.rank} ` : "") + x.name)))));
  root.append(kv("combination", r.name, "score", r.ok ? `${fmt(r.metric)}${r.rank ? ` · rank ${r.rank}` : ""}${r.delta >= 0.05 ? ` · ${r.delta.toFixed(1)}% behind the best` : ""}` : (r.error || "failed"),
    "activation", r.activation, "optimizer", `${r.optimizer}${r.lr != null ? " · lr " + r.lr : " · default lr"}`, "network", `[${r.arch.join(", ")}] · ${r.norm} · ${r.res}`,
    "size / time", `${bHuman(r.params)} parameters · ${bDur(r.seconds)} · ${r.steps_per_s?.toFixed(0) || "–"} steps/s`, "final train loss", fmt(r.final_loss)));
  if (r.curve?.length > 1) {
    const ch = new Chart(root, { height: 240, title: "Loss", sub: "log scale" });
    const ser = [{ name: "train", x: r.curve.map(p => p[0]), y: r.curve.map(p => p[1]), color: series()[0] }];
    if (r.val_curve?.length) ser.push({ name: "validation", x: r.val_curve.map(p => p[0]), y: r.val_curve.map(p => p[1]), color: series()[1], dots: true });
    requestAnimationFrame(() => drawXY(ch, { series: ser, xLabel: "step", yLabel: "loss", logY: true }));
  }
}
async function pollMB() {
  clearTimeout(MB.timer);
  try {
    const prev = MB.st?.state, st = await api("/api/bench/status", { known: MB.known });
    if (st.results_from === MB.known) { MB.results.push(...st.results); MB.known += st.results.length; } else { MB.results = st.results; MB.known = st.results.length; }
    MB.st = st;
    if (S.page === "bench") { if (prev && prev !== st.state) whenNotTyping(renderBench); else drawBenchMonitor(); }
    if (prev && prev !== st.state && ["done", "error", "stopped"].includes(st.state)) toast(st.state === "error" ? "Benchmark failed: " + st.error : `Benchmark ${st.state}: ${st.done} of ${st.total}`, st.state !== "error");
  } catch { /* ignore */ }
  MB.timer = setTimeout(pollMB, mbBusy() ? 1000 : 5000);
}

// ───────────────────────── boot ─────────────────────────
async function boot() {
  const savedTheme = store.get("theme", null); if (savedTheme) document.documentElement.dataset.theme = savedTheme;
  $("#themeBtn").onclick = () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.dataset.theme = dark ? "light" : "dark"; store.set("theme", document.documentElement.dataset.theme); showPage(S.page);
  };
  for (const b of $("#modes").children) b.onclick = () => showPage(b.dataset.page);
  $("#reloadBtn").onclick = () => poll(true);
  $("#resetBtn").onclick = resetInputs;
  $("#pinBtn").onclick = pin;
  $("#randRow").onclick = async () => {
    try {
      const r = await api("/api/dataset_row");
      S.inputs = { ...S.inputs, ...r.inputs }; S.targets = r.targets;
      $("#rowNote").textContent = `Loaded training row ${r.index + 1} of ${r.rows}; targets shown under the prediction.`;
      syncInputs(); onInputsChanged();
    } catch (e) { toast(e.message); }
  };
  const watch = $("#watch"); watch.checked = store.get("watch", true); watch.onchange = () => store.set("watch", watch.checked);
  let app = { has_model: false };
  try { app = await api("/api/app"); } catch (e) { toast("Server unreachable: " + e.message); }
  const wanted = location.hash.slice(1);
  S.page = wanted === "train" || wanted === "bench" ? wanted : TABS.some(t => t[0] === wanted) ? "explore" : (app.start_page ? "explore" : (app.has_model ? store.get("page", "explore") : "train"));
  if (app.has_model) { try { await initExplore(); } catch (e) { toast("Could not load model: " + e.message); } }
  showPage(S.page);
  if (!app.has_model) $("#noModelErr").textContent = app.model_error || "";
  pollTrain();
  pollMB();
  setInterval(() => { if (watch.checked) poll(false); }, 2000);
  // Redraw for real width changes only. Mobile Chrome fires resize when the on-screen keyboard or the
  // address bar appears (height only); rebuilding then destroys the tapped field and closes the keyboard.
  let rw, lastW = innerWidth;
  const relayout = () => { if (innerWidth !== lastW) whenNotTyping(() => { lastW = innerWidth; showPage(S.page); }); };
  addEventListener("resize", () => { clearTimeout(rw); rw = setTimeout(relayout, 150); });
}
boot();
</script>
