<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JiT5 Studio</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3f0; --surface: #fcfcfb; --surface-2: #f0efec; --border: #dddcd7;
  --text: #0b0b0b; --text-2: #52514e; --muted: #8a8983; --grid: #e7e6e2;
  --accent: #2a78d6; --accent-ink: #ffffff; --danger: #c93c3b; --good: #008300; --warn: #b77a00;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #34342f;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86; --grid: #2c2c29;
    --accent: #3987e5; --accent-ink: #ffffff; --danger: #e66767; --good: #3fae3f; --warn: #d9a232;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #34342f;
  --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86; --grid: #2c2c29;
  --accent: #3987e5; --accent-ink: #ffffff; --danger: #e66767; --good: #3fae3f; --warn: #d9a232;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 15px; margin: 0; font-weight: 650; }
header .meta { color: var(--text-2); font-size: 12px; }
header .spacer { flex: 1; }
.modes { display: flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px; flex-wrap: wrap; }
.modes button { border: 0; background: none; padding: 4px 14px; border-radius: 6px; color: var(--text-2); }
.modes button.active { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.page { padding: 14px 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 14px; min-width: 0; }
.card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-2); margin: 0 0 10px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card h2 .grow { flex: 1; }
input[type=number], input[type=text], select, textarea { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font: inherit; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 0; }
input::placeholder { color: var(--muted); }
textarea { width: 100%; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; resize: vertical; }
button { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.danger { color: var(--danger); border-color: var(--danger); }
.btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 12px; }
.ctl { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--text-2); min-width: 0; }
.ctl > span { display: flex; justify-content: space-between; gap: 6px; }
.ctl > span .hint { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctl input[type=number], .ctl input[type=text], .ctl select { width: 100%; }
.ctl.check { flex-direction: row; align-items: center; gap: 6px; color: var(--text); padding-top: 16px; }
.ctl.check input { accent-color: var(--accent); margin: 0; }
.ctl.wide { grid-column: 1 / -1; }
.ctl.bad input, .ctl.bad select { border-color: var(--danger); }
.pathrow { display: flex; gap: 6px; }
.pathrow input { flex: 1; }
.setup { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; align-items: start; }
@media (max-width: 1000px) { .setup { grid-template-columns: minmax(0, 1fr); } }
.sticky { position: sticky; top: 64px; }
@media (max-width: 1000px) { .sticky { position: static; } }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 1100px) { .two { grid-template-columns: minmax(0, 1fr); } }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1200px) { .three { grid-template-columns: minmax(0, 1fr); } }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12px; font-variant-numeric: tabular-nums; }
.kv div:nth-child(odd) { color: var(--text-2); }
.kv div:nth-child(even) { word-break: break-all; }
.note { color: var(--text-2); font-size: 12px; margin: 0 0 10px; }
.muted { color: var(--muted); }
.warn { color: var(--danger); font-size: 12px; }
.okmsg { color: var(--good); font-size: 12px; }
.pill { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); white-space: nowrap; }
.state { font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); }
.state.training, .state.preparing, .state.queued, .state.running, .state.stopping { color: var(--accent); border-color: var(--accent); }
.state.error { color: var(--danger); border-color: var(--danger); }
.state.done, .state.stopped { color: var(--good); border-color: var(--good); }
.progress { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; margin: 8px 0; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width .5s; }
.big { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.stat .lab { color: var(--text-2); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.stat .val { font-size: 18px; font-weight: 650; font-variant-numeric: tabular-nums; }
.chart { position: relative; min-width: 0; }
.chart canvas { display: block; width: 100%; }
.chart .title { font-weight: 600; font-size: 12px; margin-bottom: 4px; display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; }
.chart .title .sub { color: var(--muted); font-weight: 400; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--text-2); margin: 4px 0; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tooltip { position: fixed; pointer-events: none; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.15); z-index: 50; display: none; max-width: 320px; font-variant-numeric: tabular-nums; }
.tooltip .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.toast { position: fixed; bottom: 16px; right: 16px; background: var(--danger); color: #fff; padding: 8px 12px; border-radius: 8px; max-width: min(560px, calc(100vw - 32px)); display: none; z-index: 60; white-space: pre-wrap; }
.log { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; max-height: 260px; overflow: auto; background: var(--surface-2); border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; word-break: break-word; }
.log .k-spike { color: var(--warn); }
.log .k-error { color: var(--danger); }
.log .k-checkpoint { color: var(--good); }
.preview img { max-width: 100%; image-rendering: pixelated; border-radius: 6px; background: var(--surface-2); display: block; }
.preview .bar { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
.preview input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--tile, 128px), 1fr)); gap: 8px; }
.gallery figure { margin: 0; background: var(--surface-2); border-radius: 8px; overflow: hidden; }
.gallery img { width: 100%; display: block; image-rendering: pixelated; aspect-ratio: auto; }
.gallery figcaption { font-size: 11px; color: var(--text-2); padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gallery .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.film { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.film figure { margin: 0; flex: 0 0 auto; text-align: center; }
.film img { width: 96px; height: 96px; object-fit: contain; image-rendering: pixelated; background: var(--surface-2); border-radius: 6px; display: block; }
.film figcaption { font-size: 10px; color: var(--muted); }
.thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; background: var(--surface-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 2px 10px; font-size: 12px; cursor: pointer; user-select: none; }
.chip.on { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); border-color: var(--accent); color: var(--text); }
.chip input { display: none; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 16px; }
.modal .card { width: min(640px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; margin: 0; }
.browser { border: 1px solid var(--border); border-radius: 8px; overflow: auto; min-height: 200px; flex: 1; margin: 8px 0; }
.browser .item { padding: 4px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
.browser .item:hover, .browser .item.sel { background: var(--surface-2); }
.browser .path { padding: 6px 10px; font-size: 12px; color: var(--text-2); border-bottom: 1px solid var(--grid); position: sticky; top: 0; background: var(--surface); word-break: break-all; }
table.data { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; }
table.data th, table.data td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.data th { color: var(--text-2); font-weight: 600; }
table.data tr.click { cursor: pointer; }
table.data tr.click:hover td, table.data tr.sel td { background: var(--surface-2); }
.scroll { overflow: auto; }
.modlist { max-height: 300px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; padding: 4px 0; }
.modlist label { display: flex; gap: 6px; align-items: center; padding: 1px 8px; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.modlist label .muted { margin-left: auto; font-family: system-ui, sans-serif; }
details summary { cursor: pointer; color: var(--text-2); font-size: 12px; margin: 6px 0; }
.section-sub { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 12px 0 6px; grid-column: 1 / -1; }
.empty { color: var(--muted); padding: 24px; text-align: center; }
[hidden] { display: none !important; }
canvas { max-width: 100%; }
</style>
</head>
<body>
<header>
  <h1>JiT5 Studio</h1>
  <nav class="modes" id="modes"><button data-page="setup">Setup</button><button data-page="monitor">Monitor</button><button data-page="sample">Sample</button></nav>
  <span class="meta" id="deviceInfo"></span>
  <span class="meta" id="runBadge"></span>
  <span class="spacer"></span>
  <button id="themeBtn" title="Toggle light / dark">Theme</button>
</header>
<div id="setupPage" class="page" hidden></div>
<div id="monitorPage" class="page" hidden></div>
<div id="samplePage" class="page" hidden></div>
<div class="tooltip" id="tooltip"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
// ───────────────────────── utilities ─────────────────────────
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else if (k === "checked") e.checked = !!v;
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fmt(v, digits = 4) {
  if (v == null || Number.isNaN(v)) return "–";
  if (typeof v !== "number") return String(v);
  const a = Math.abs(v);
  if (a !== 0 && (a >= 1e5 || a < 1e-3)) return v.toExponential(2);
  return Number(v.toPrecision(digits)).toString();
}
const fmtInt = v => v == null ? "–" : Math.round(v).toLocaleString();
function fmtDur(s) {
  if (!Number.isFinite(s) || s < 0) return "–";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return h ? `${h}h ${String(m).padStart(2, "0")}m` : m ? `${m}m ${String(ss).padStart(2, "0")}s` : `${ss}s`;
}
const kv = (...pairs) => el("div", { class: "kv" }, pairs.flat().map(p => el("div", {}, p ?? "–")));
function toast(msg, ok = false) { const t = $("#toast"); t.textContent = msg; t.style.background = ok ? "var(--good)" : "var(--danger)"; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", ok ? 4000 : 9000); }
async function api(path, body = {}) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({ error: `HTTP ${r.status}` }));
  if (!r.ok || j.error) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
const imgUrl = (path, size) => `/api/image?path=${encodeURIComponent(path)}${size ? `&size=${size}` : ""}`;  // stable URL: the browser caches it
const store = {
  get(k, d) { try { const v = localStorage.getItem("jit5." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("jit5." + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
// Run fn now, or after the user leaves the form field they are typing in (rebuilding would destroy it).
function whenNotTyping(fn) {
  const a = document.activeElement;
  if (a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName) && a.isConnected && !a.closest(".modal")) a.addEventListener("blur", () => setTimeout(fn, 0), { once: true });
  else fn();
}
function keepScroll(fn) {
  const y = window.scrollY, body = document.body;
  const act = document.activeElement, fkey = act && act.dataset ? act.dataset.fkey : null;
  body.style.minHeight = document.documentElement.scrollHeight + "px";
  try { return fn(); } finally {
    if (fkey && !act.isConnected) {
      const twin = document.querySelector(`[data-fkey="${CSS.escape(fkey)}"]`);
      if (twin) twin.focus({ preventScroll: true });
    }
    if (window.scrollY !== y) window.scrollTo(0, y);
    requestAnimationFrame(() => { body.style.minHeight = ""; });
  }
}

// ───────────────────────── charts ─────────────────────────
function niceTicks(lo, hi, n = 5) {
  if (!(hi > lo)) hi = lo + 1;
  const span = hi - lo, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) out.push(Math.abs(v) < step * 1e-9 ? 0 : v);
  return out;
}
const tip = $("#tooltip");
function showTip(html, ev) {
  if (!html) { tip.style.display = "none"; return; }
  tip.innerHTML = html; tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  tip.style.left = Math.max(4, x) + "px"; tip.style.top = Math.max(4, y) + "px";
}
class Chart {
  constructor(parent, { height = 220, title = "", sub = "" } = {}) {
    this.root = el("div", { class: "chart" });
    this.titleEl = el("div", { class: "title" }, title, sub ? el("span", { class: "sub" }, sub) : null);
    this.legendEl = el("div", { class: "legend" });
    this.canvas = el("canvas", { role: "img", "aria-label": title || "chart" });
    this.root.append(this.titleEl, this.canvas, this.legendEl);
    parent.append(this.root);
    this.height = height; this.canvas.style.height = height + "px";
    this.canvas.addEventListener("mousemove", ev => { if (this.hover) { const p = this.pos(ev); showTip(this.hover(p.x, p.y), ev); this.redraw?.(p); } });
    this.canvas.addEventListener("mouseleave", () => { showTip(null); this.redraw?.(null); });
  }
  pos(ev) { const r = this.canvas.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
  setup() {
    const dpr = window.devicePixelRatio || 1, w = Math.max(200, this.canvas.clientWidth || this.root.clientWidth || 400), h = this.height;
    this.canvas.width = Math.round(w * dpr); this.canvas.height = Math.round(h * dpr);
    const ctx = this.canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    this.w = w; this.ctx = ctx;
    return ctx;
  }
  legend(items) {
    const key = items.map(i => i.join()).join("|");
    if (key === this.legendKey) return;
    this.legendKey = key;
    this.legendEl.replaceChildren(...items.map(([name, color]) => el("span", {}, el("span", { class: "sw", style: `background:${color}` }), name))); }
}
const tickFmt = v => { const a = Math.abs(v); return a !== 0 && (a >= 1e5 || a < 1e-3) ? v.toExponential(1).replace(".0e", "e") : fmt(v, 3); };
// Multi-series line chart; each series has its own x. logY plots log10 with decade labels.
function drawSeries(chart, { series, xLabel = "step", yLabel = "", logY = false, empty = "no data yet" }) {
  const ctx = chart.setup(), W = chart.w, H = chart.height;
  const tf = v => logY ? (v > 0 ? Math.log10(v) : null) : v;
  let xlo = Infinity, xhi = -Infinity, ylo = Infinity, yhi = -Infinity;
  for (const s of series) for (let i = 0; i < s.x.length; i++) {
    const y = tf(s.y[i]); if (y == null || !Number.isFinite(y)) continue;
    xlo = Math.min(xlo, s.x[i]); xhi = Math.max(xhi, s.x[i]);
    if (!s.noScale) { ylo = Math.min(ylo, y); yhi = Math.max(yhi, y); }
  }
  chart.legend(series.filter(s => !s.hideLegend).map(s => [s.name, s.color]));
  if (!Number.isFinite(xlo) || !Number.isFinite(ylo)) {
    ctx.fillStyle = css("--muted"); ctx.font = "12px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.fillText(empty, W / 2, H / 2);
    chart.hover = null; chart.redraw = null; return;
  }
  if (xhi === xlo) { xhi = xlo + 1; }
  if (yhi === ylo) { const d = Math.abs(ylo) * .1 || 1; ylo -= d; yhi += d; }
  const pad = (yhi - ylo) * .06; ylo -= pad; yhi += pad;
  const box = { l: 56, r: W - 12, t: 8, b: H - 32 };
  const sx = v => box.l + (v - xlo) / (xhi - xlo) * (box.r - box.l);
  const sy = v => box.b - (v - ylo) / (yhi - ylo) * (box.b - box.t);
  const frame = () => {
    ctx.clearRect(0, 0, W, H);
    ctx.font = "11px system-ui, sans-serif"; ctx.lineWidth = 1; ctx.strokeStyle = css("--grid"); ctx.fillStyle = css("--muted");
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    for (const v of niceTicks(ylo, yhi, Math.max(2, Math.floor((box.b - box.t) / 36)))) {
      const y = sy(v); ctx.beginPath(); ctx.moveTo(box.l, y); ctx.lineTo(box.r, y); ctx.stroke();
      ctx.fillText(tickFmt(logY ? Math.pow(10, v) : v), box.l - 6, y);

  if (r.spikes && r.spikes.length) right.append(el("div", { class: "card" }, el("h2", {}, "Spike guard events"), el("div", { class: "log" }, r.spikes.map(x => el("div", { class: "k-spike" }, x)))));
  const node = el("div", {}, el("div", { class: "muted", style: "margin-bottom:8px" }, r.path), el("div", { class: "two" }, chartsCard, right));
  // Charts measure their width, so draw them once the node is in the page.
  requestAnimationFrame(() => {

    else chartsCard.append(el("div", { class: "empty" }, "No metrics.csv in this folder (a sampling run)."));
  });
  return node;
}

// ───────────────────────── Sample page ─────────────────────────
function renderSample() {
  const page = $("#samplePage");
  const s = S.sample, info = S.sinfo;
  const ckptRows = [];
  if (S.runs) for (const c of S.runs.checkpoints) ckptRows.push(c);
  const pick = el("div", { class: "card" }, el("h2", {}, "Checkpoint"),
    el("div", { class: "btns" }, ckptRows.map(c => el("button", { class: info && info.checkpoint === c.path ? "primary" : "", onclick: () => loadSampler(c.path) }, `${c.name} · ${new Date(c.mtime * 1000).toLocaleString()}`)),
      el("button", { onclick: () => browse({ title: "Checkpoint", start: S.ckdir, pick: "file", kinds: ["checkpoint"], onPick: loadSampler }) }, "Other checkpoint…"),
      el("button", { onclick: refreshRuns }, "Refresh")),
    info ? el("div", { style: "margin-top:10px" }, kv("File", info.checkpoint, "Weights", info.weights, "Architecture", (MODEL[info.config.model_type] || {}).name, "Output", `${info.size[0]}×${info.size[1]}×${info.channels}`,
      "Conditioning", info.conditioning + (info.classes.length ? ` · ${info.classes.length} classes` : ""), "Parameters", fmtInt(info.params), "Device", info.device)) : el("p", { class: "note", style: "margin-top:8px" }, "Load a checkpoint to sample from it."));
  if (!info) { page.replaceChildren(pick); return; }
  const change = () => store.set("sample", s);
  const fields = [
    { key: "steps", label: "Heun steps", type: "int", ph: () => info.config.sampling_steps },
    { key: "seed", label: "Seed", type: "int", hint: "0 = random" },
    { key: "count", label: "Image count", type: "int", show: () => info.conditioning === "unconditional" },
    { key: "batch_size", label: "Batch size", type: "int" },
    { key: "guidance_scale", label: "Guidance strength", type: "num", show: () => info.guidance_available, ph: () => info.config.guidance_scale, hint: "1 = unguided" },
    { key: "x_clip", label: "Predicted-x clipping", type: "select", options: () => [["", `as trained (${info.config.x_clip})`], ["none", "none"], ["static", "static"], ["dynamic", "dynamic"]] },
    { key: "framing", label: "Large inputs", type: "select", show: () => info.conditioning === "pix2pix", options: [["tile", "tile at training scale"], ["center", "one center window"]] },
    { key: "combined", label: "Also save combined A|B pairs", type: "bool", show: () => info.conditioning === "pix2pix" },
    { key: "trajectory", label: "Record denoising trajectory", type: "bool" },
  ];
  const settings = el("div", { class: "card" }, el("h2", {}, "Settings"), fieldGrid(fields, s, change));
  if (info.conditioning === "class") {
    const counts = s.classes[info.checkpoint] = s.classes[info.checkpoint] || {};
    settings.append(el("div", { class: "section-sub" }, "Images per class"),
      el("div", { class: "form-grid" }, [["-1", "random class"], ...info.classes.map((c, i) => [String(i), c])].map(([i, name]) =>
        el("label", { class: "ctl" }, el("span", {}, name), el("input", { type: "text", inputmode: "numeric", placeholder: "0", value: counts[i] || "", onchange: e => { counts[i] = Math.max(0, parseInt(e.target.value) || 0); change(); } })))),
      el("div", { class: "btns", style: "margin-top:8px" }, el("button", { onclick: () => { info.classes.forEach((_, i) => counts[i] = 1); change(); renderSample(); } }, "One of each"), el("button", { onclick: () => { for (const k in counts) delete counts[k]; change(); renderSample(); } }, "Clear")));
  }
  if (info.conditioning === "pix2pix") {
    s.inputs = s.inputs || [];
    settings.append(el("div", { class: "section-sub" }, "Input images or folders"),
      el("div", { class: "chips" }, s.inputs.map((p, j) => el("span", { class: "chip on", title: p, onclick: () => { s.inputs.splice(j, 1); change(); renderSample(); } }, p.split("/").at(-1) || p, " ✕"))),
      el("div", { class: "btns", style: "margin-top:8px" },
        el("button", { onclick: () => browse({ title: "Input image", start: s.inputs.at(-1) || OPT.cwd, pick: "file", kinds: ["image"], onPick: p => { s.inputs.push(p); change(); renderSample(); } }) }, "Add image…"),
        el("button", { onclick: () => browse({ title: "Input folder", start: s.inputs.at(-1) || OPT.cwd, pick: "folder", onPick: p => { s.inputs.push(p); change(); renderSample(); } }) }, "Add folder…")));
  }
  const R = { nRes: 0, nFilm: 0 };
  R.gen = el("button", { class: "primary", onclick: startSampling }, "Generate");
  R.stop = el("button", { class: "danger", onclick: () => api("/api/sample/stop").catch(e => toast(e.message)) }, "Stop");
  R.gpu = el("span", { class: "muted" }, "A training run is using the GPU; sampling shares it.");
  settings.append(el("div", { class: "btns", style: "margin-top:12px" }, R.gen, R.stop, R.gpu));
  const out = el("div", { class: "card" }, el("h2", {}, "Results", R.state = el("span", { class: "state" }), R.seed = el("span", { class: "pill" }), el("span", { class: "grow" }),
      el("label", { class: "ctl check", style: "padding:0;text-transform:none;letter-spacing:0" }, "size",
        el("input", { type: "range", min: 64, max: 384, value: S.tile, oninput: e => { S.tile = +e.target.value; store.set("tile", S.tile); R.gal.style.setProperty("--tile", `${S.tile}px`); } }))),
    R.err = el("div", { class: "warn" }),
    R.prog = el("div", {}, el("div", { class: "progress" }, R.bar = el("div", {})), R.progText = el("div", { class: "muted" })),
    R.filmWrap = el("div", {}, el("div", { class: "section-sub" }, "Denoising trajectory · predicted clean image (first sample)"), R.film = el("div", { class: "film" })),
    R.galWrap = el("div", {}, R.galSub = el("div", { class: "section-sub" }), R.gal = el("div", { class: "gallery", style: `--tile:${S.tile}px` })),
    R.empty = el("div", { class: "empty" }, "Generated images appear here and are saved to a new run folder next to the checkpoint."));
  SM = R;
  page.replaceChildren(el("div", { class: "two" }, el("div", {}, pick, settings), el("div", {}, out)));
  updateSample();
}
let SM = null;  // the sample page's live elements
function updateSample() {
  if (!SM || !$("#samplePage").contains(SM.gal)) return;
  const st = S.sstatus || {}, running = st.state === "running";
  SM.gen.disabled = running; setText(SM.gen, running ? "Sampling…" : "Generate");
  SM.stop.hidden = !running;
  SM.gpu.hidden = !["queued", "preparing", "training", "stopping"].includes(S.train.state);
  SM.state.hidden = !st.state; SM.state.className = "state " + (st.state || ""); setText(SM.state, st.state);
  SM.seed.hidden = !st.seed; setText(SM.seed, st.seed ? `seed ${st.seed}` : "");
  SM.err.hidden = !st.error; setText(SM.err, st.error);
  SM.prog.hidden = !st.total;
  SM.bar.style.width = `${st.total ? 100 * st.done / st.total : 0}%`;
  setText(SM.progText, st.total ? `${st.done} / ${st.total} images · ${st.output_dir || ""}` : "");
  const traj = st.trajectory || [];
  if (traj.length < SM.nFilm) { SM.film.replaceChildren(); SM.nFilm = 0; }
  SM.film.append(...traj.slice(SM.nFilm).map(f => el("figure", {}, el("img", { src: f.image }), el("figcaption", {}, `step ${f.step}/${f.steps}`))));
  SM.nFilm = traj.length; SM.filmWrap.hidden = !traj.length;
  if (S.sresults.length < SM.nRes) { SM.gal.replaceChildren(); SM.nRes = 0; }
  SM.gal.append(...S.sresults.slice(SM.nRes).map(r => r.error ? el("figure", {}, el("figcaption", { class: "warn" }, `${r.label}: ${r.error}`)) :
    el("figure", { title: r.path }, r.source ? el("div", { class: "pair" }, el("img", { src: r.source }), el("img", { src: r.image })) : el("img", { src: r.image }),
      el("figcaption", {}, r.label + (r.windows > 1 ? ` · ${r.windows} tiles` : "")))));
  SM.nRes = S.sresults.length;
  SM.galWrap.hidden = !SM.nRes;
  setText(SM.galSub, st.grid ? "Images (grid saved as generated_grid.png)" : "Images");
  SM.empty.hidden = !!SM.nRes || running;
}
async function loadSampler(path) {
  try { S.sinfo = await api("/api/sample/load", { path }); toast("Checkpoint loaded", true); } catch (e) { toast(e.message); }
  renderSample();
}
// After a page reload: show the checkpoint and results the server still holds.
async function reattachSampler() {
  try {
    const r = await api("/api/sample/status", { since: 0 });
    if (!r.checkpoint || S.sinfo) return;
    S.sinfo = await api("/api/sample/load", { path: r.checkpoint });
    S.sresults = r.results; S.ssince = r.result_total; S.sstatus = r;
    if (r.state === "running") pollSample();
    if (S.page === "sample") renderSample();
  } catch (e) { /* nothing loaded yet */ }
}
let samplePoll = null;
async function startSampling() {
  const s = S.sample, info = S.sinfo;
  const body = { checkpoint: info.checkpoint, steps: s.steps, seed: s.seed, batch_size: s.batch_size, count: s.count, guidance_scale: s.guidance_scale,
    x_clip: s.x_clip || null, framing: s.framing, combined: s.combined, trajectory: s.trajectory, inputs: s.inputs };
  if (info.conditioning === "class") body.classes = Object.entries(s.classes[info.checkpoint] || {}).filter(([, n]) => n > 0).map(([i, n]) => ({ index: Number(i), count: n }));
  try { S.sstatus = await api("/api/sample/start", body); S.sresults = []; S.ssince = 0; updateSample(); pollSample(); } catch (e) { toast(e.message); }
}
async function pollSample() {
  clearTimeout(samplePoll);
  try {
    const r = await api("/api/sample/status", { since: S.ssince });
    S.sresults.push(...r.results); S.ssince = r.result_total; S.sstatus = r;
    if (S.page === "sample") updateSample();
    if (r.state === "running") samplePoll = setTimeout(pollSample, 500);
  } catch (e) { toast(e.message); }
}

// ───────────────────────── boot ─────────────────────────
function showPage(p) {
  S.page = p; store.set("page", p);
  for (const b of document.querySelectorAll("#modes button")) b.classList.toggle("active", b.dataset.page === p);
  for (const name of ["setup", "monitor", "sample"]) $(`#${name}Page`).hidden = name !== p;
  if (p === "setup") renderSetup();
  if (p === "monitor") { if (!S.runs) refreshRuns(); renderMonitor(); }
  if (p === "sample") { if (!S.runs) refreshRuns(); if (!S.sinfo) reattachSampler(); renderSample(); }
}
function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
async function boot() {
  applyTheme(store.get("theme", null));
  $("#themeBtn").onclick = () => {
    const dark = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    const t = dark ? "light" : "dark"; store.set("theme", t); applyTheme(t); showPage(S.page);
  };
  try { OPT = await api("/api/options"); } catch (e) { document.body.append(el("div", { class: "empty" }, "Cannot reach the jit5 GUI server: " + e.message)); return; }
  OPT.models.forEach(m => MODEL[m.key] = m); OPT.optimizers.forEach(o => OPTIM[o.key] = o);
  S.ckdir = S.ckdir || OPT.save_dir;
  S.form = { ...structuredClone(OPT.defaults), ...store.get("form", {}) };
  $("#deviceInfo").textContent = `${OPT.device}${OPT.gpu ? " · " + OPT.gpu : ""} · ${OPT.cwd}`;
  for (const b of document.querySelectorAll("#modes button")) b.onclick = () => showPage(b.dataset.page);
  // #setup, #monitor or #sample opens that page; #setup:continue also picks the setup mode
  const [linked, mode] = location.hash.slice(1).split(":");
  if (["new", "json", "continue", "finetune"].includes(mode)) S.setupMode = mode;
  showPage(["setup", "monitor", "sample"].includes(linked) ? linked : S.page);
  if (S.setupMode === "new") autoCheck();
  if (S.form.dataset_path) inspectDataset();
  pollTrain();
  window.addEventListener("resize", debounce(() => { if (S.page === "monitor" && M) M.redraw(); }, 200));
}
boot();
